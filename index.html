<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎂 Happy Birthday Caroline! 🎂</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(145deg, #1a1a2e, #16213e);
            padding: 16px;
        }
        .card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 48px;
            padding: 40px 32px;
            max-width: 550px;
            width: 100%;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.6);
            transition: 0.4s ease;
            text-align: center;
        }
        h1 {
            color: #f9d342;
            font-size: 2.2rem;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        .subhead {
            color: #b0b0d0;
            font-size: 1rem;
            margin-bottom: 28px;
            border-bottom: 1px dashed #3a3a5a;
            padding-bottom: 16px;
        }

        .photo-section {
            margin: 10px auto 20px;
            position: relative;
            width: 160px;
            height: 160px;
            border-radius: 50%;
            border: 4px solid #f9d342;
            box-shadow: 0 0 30px rgba(249, 211, 66, 0.2);
            overflow: hidden;
            transition: 0.5s ease;
            background: #1a1a3a;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .photo-section img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.5s ease;
        }
        .photo-section .photo-placeholder {
            color: #5a5a8a;
            font-size: 0.8rem;
            text-align: center;
            padding: 10px;
            line-height: 1.4;
        }
        .photo-section .photo-placeholder span {
            display: block;
            font-size: 2.4rem;
            margin-bottom: 4px;
        }
        .photo-section.unlocked {
            border-color: #ff6b9d;
            box-shadow: 0 0 50px rgba(255, 107, 157, 0.4);
            animation: glowPulse 1.5s ease-in-out infinite;
        }
        @keyframes glowPulse {
            0%, 100% { box-shadow: 0 0 30px rgba(255, 107, 157, 0.3); }
            50% { box-shadow: 0 0 60px rgba(255, 107, 157, 0.6); }
        }

        .puzzle-box {
            background: #0f0f1f;
            border-radius: 28px;
            padding: 24px 20px;
            margin: 20px 0;
            border: 1px solid #3a3a5a;
        }
        .question-item {
            background: #16162e;
            border-radius: 16px;
            padding: 14px 16px;
            margin: 12px 0;
            border-left: 3px solid #f9d342;
            text-align: left;
        }
        .question-item label {
            color: #cdd0ff;
            font-size: 0.95rem;
            font-weight: 500;
            display: block;
            margin-bottom: 6px;
        }
        .question-item .hint {
            color: #7a7a9a;
            font-size: 0.75rem;
            font-style: italic;
        }
        .question-item input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 12px;
            border: 2px solid #2a2a5a;
            background: #0a0a1a;
            color: #f9d342;
            font-size: 1rem;
            outline: none;
            transition: 0.2s;
            margin-top: 4px;
        }
        .question-item input:focus {
            border-color: #f9d342;
            box-shadow: 0 0 20px #f9d34222;
        }
        .question-item input::placeholder {
            color: #4a4a6a;
        }
        .question-item.correct {
            border-left-color: #6bff6b;
            background: #162a16;
        }
        .question-item.wrong {
            border-left-color: #ff6b6b;
            background: #2a1616;
        }

        .lock-icon {
            font-size: 2.8rem;
            margin: 6px 0 4px;
            filter: drop-shadow(0 0 12px #f9d34244);
        }
        .action-btn {
            background: #f9d342;
            border: none;
            padding: 16px 32px;
            border-radius: 60px;
            font-size: 1.2rem;
            font-weight: 700;
            color: #12122a;
            cursor: pointer;
            transition: 0.2s;
            letter-spacing: 1px;
            box-shadow: 0 6px 0 #b38f2a;
            margin-top: 16px;
            width: 100%;
        }
        .action-btn:active {
            transform: translateY(5px);
            box-shadow: 0 1px 0 #b38f2a;
        }
        .action-btn:disabled {
            opacity: 0.5;
            transform: translateY(3px);
            box-shadow: 0 3px 0 #b38f2a;
            pointer-events: none;
        }
        .message-area {
            margin-top: 24px;
            padding: 18px 12px;
            border-radius: 30px;
            background: #0d0d1f;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #2a2a4a;
            transition: 0.3s;
        }
        .message-area .gift-message {
            color: #e0e0ff;
            font-size: 1rem;
            font-weight: 400;
            line-height: 1.8;
            padding: 6px;
            text-align: left;
            max-height: 450px;
            overflow-y: auto;
            width: 100%;
        }
        .message-area .gift-message strong {
            color: #f9d342;
        }
        .message-area .gift-message .highlight {
            color: #ff6b9d;
        }
        .message-area .gift-message .emoji-big {
            font-size: 1.8rem;
            display: block;
            text-align: center;
            margin: 8px 0;
        }
        .message-area .gift-message .signature {
            text-align: right;
            color: #f9d342;
            font-style: italic;
            margin-top: 16px;
            font-size: 1.1rem;
        }
        .error-text {
            color: #ff7a7a;
            font-size: 0.95rem;
        }
        .progress-text {
            color: #7a7a9a;
            font-size: 0.85rem;
            margin-top: 8px;
        }
        .footer {
            color: #5a5a7a;
            font-size: 0.8rem;
            margin-top: 24px;
            border-top: 1px solid #222244;
            padding-top: 18px;
        }
        .sparkle {
            position: fixed;
            pointer-events: none;
            font-size: 2rem;
            animation: sparkleFade 1.2s ease-out forwards;
            z-index: 999;
        }
        @keyframes sparkleFade {
            0% { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); }
            100% { opacity: 0; transform: translateY(-120px) scale(0.2) rotate(720deg); }
        }

        .music-player {
            background: #1a1a3a;
            border-radius: 20px;
            padding: 16px;
            margin: 16px 0;
            border: 1px solid #3a3a5a;
            transition: 0.3s;
        }
        .music-player:hover {
            border-color: #f9d342;
        }
        .music-player .song-title {
            color: #f9d342;
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 8px;
        }
        .music-player .song-title span {
            color: #b0b0d0;
            font-weight: 400;
        }
        .music-player audio {
            width: 100%;
            border-radius: 30px;
            outline: none;
        }
        .music-player audio::-webkit-media-controls-panel {
            background: #0f0f2a;
        }
        .music-player audio::-webkit-media-controls-play-button {
            background: #f9d342;
            border-radius: 50%;
        }
        .music-player .listen-instruction {
            color: #7a7a9a;
            font-size: 0.75rem;
            margin-top: 6px;
            font-style: italic;
        }

        .message-area .gift-message::-webkit-scrollbar {
            width: 4px;
        }
        .message-area .gift-message::-webkit-scrollbar-track {
            background: #1a1a3a;
            border-radius: 10px;
        }
        .message-area .gift-message::-webkit-scrollbar-thumb {
            background: #f9d342;
            border-radius: 10px;
        }

        @media (max-width: 480px) {
            .card { padding: 28px 16px; }
            h1 { font-size: 1.8rem; }
            .photo-section { width: 120px; height: 120px; }
            .question-item { padding: 12px; }
            .message-area .gift-message { font-size: 0.9rem; max-height: 350px; }
        }
    </style>
</head>
<body>
    <div class="card" id="app">
        <h1>🎁 LOCKED GIFT</h1>
        <div class="subhead">✨ Caroline, solve these to open! ✨</div>

        <div class="photo-section" id="photoSection">
            <img 
                id="friendPhoto"
                src="images/caroline.jpg"
                alt="Caroline"
                onerror="this.style.display='none'; document.getElementById('placeholderFallback').style.display='flex';"
            >
            <div class="photo-placeholder" id="placeholderFallback" style="display:none;">
                <span>🌸</span>
                Caroline's<br>Photo Here
            </div>
        </div>

        <div class="puzzle-box">
            <div class="lock-icon">🔐</div>
            
            <div class="question-item" id="q1">
                <label>🎭 What's your cool nickname? <span class="hint">(hint: it's French-ish)</span></label>
                <input type="text" id="ans1" placeholder="Type your answer..." autocomplete="off">
            </div>

            <div class="question-item" id="q2">
                <label>📅 What day were you born on? <span class="hint">(just the number)</span></label>
                <input type="text" id="ans2" placeholder="Type your answer..." autocomplete="off">
            </div>

            <div class="question-item" id="q3">
                <label>📆 What month were you born in? <span class="hint">(number)</span></label>
                <input type="text" id="ans3" placeholder="Type your answer..." autocomplete="off">
            </div>

            <div class="progress-text" id="progressText">0 of 3 answered correctly</div>
        </div>

        <button class="action-btn" id="unlockBtn">🔓 UNLOCK GIFT</button>

        <div class="message-area" id="messageBox">
            <span style="color:#6a6a8a; font-size:0.95rem;">🔒 Answer all questions to unlock</span>
        </div>

        <div class="footer">🎂 Happy 21st Birthday, Caroline! 🎂</div>
    </div>

    <script>
        (function() {
            const QUESTIONS = [
                {
                    id: 'q1',
                    inputId: 'ans1',
                    correctAnswers: ['young pierre', 'youngpierre', 'pierre', 'young'], 
                },
                {
                    id: 'q2',
                    inputId: 'ans2',
                    correctAnswers: ['5', '05', '5th', '5 september', '5th september'],
                },
                {
                    id: 'q3',
                    inputId: 'ans3',
                    correctAnswers: ['9', '09', 'september', 'sept', 'sep'],
                }
            ];

            const SONG = {
                title: "Caroline",
                artist: "For You 💕",
                audioUrl: "music/caroline.mp3",
            };

            function getBirthdayMessage(age) {
                return `
                    <div class="gift-message">
                        <div class="emoji-big">🎉💖🎉</div>
                        
                        <strong>To my dearest Caroline,</strong><br><br>
                        
                        Here you are... 21. And I'm just sitting here thinking about how lucky I am to know you.<br><br>
                        
                        Everytime ue walk into a room and everything just... changes. People who smile more. Laughter comes easier. And somehow, you make even the most ordinary days feel special like I mean it.<br><br>
                        
                        You're hilarious. You're kind. You're talented. And you have this way of making everyone around you feel seen and important. That's rare, Caroline. So rare.<br><br>
                        
                        I dont know ue much but I think you such an amaizing person and by the way sitaki kujuwa hiyo part nyingine all I will say is I hope ue heal from the things ue dont speak about nmejifunza pple who smile most carry alot of burden and they choose to hide it with a smile like every thing is oky tutasaidiana panapohitajika sio kwenye furaha tu in the tough moments too umenielew ww katoto ue are more of my young sis and also shem la mashem zaid ya yote just stay true to yourself unajuw adui wa kwanza wako is you. That's something I would really admire from you.<br><br>
                        
                        I don't say it enough, but <strong>I'm so proud of you</strong>. Proud of who you are. Proud of who you're becoming. And so, so grateful that you exist.<br><br>
                        
                        You're stepping into a new chapter now. And I can't wait to see all the amazing things you'll do, the places you'll go, and the lives you'll touch btw dont rise hopes it jus took me 30 min to think of this😁👌.<br><br>
                        
                        Just remember — no matter where life takes you, you'll always have me. Always.<br><br>
                        
                        <span class="highlight">You are loved. You are enough. You are one of a kind.</span><br><br>
                        
                        So today, celebrate YOU. Eat the cake. Laugh until it hurts. Dance like nobody's watching. And know that you deserve every bit of happiness coming your way.<br><br>
                        
                        <span style="font-size: 1.4rem; display: block; text-align: center;">🎂🎈💕</span><br>
                        
                        Here's to 21 years of you — and to a lifetime more.<br><br>

                        <div class="music-player">
                            <div class="song-title">🎵 <span>This song is for you:</span><br>${SONG.title} — ${SONG.artist}</div>
                            <audio controls autoplay>
                                <source src="${SONG.audioUrl}" type="audio/mpeg">
                                Your browser doesn't support audio.
                            </audio>
                            <div class="listen-instruction">🎧 Play this while you read 💕</div>
                        </div>
                        
                        With all my love, always,<br>
                        <div class="signature">KD 💕</div>
                        
                        <div style="text-align: center; margin-top: 16px; color: #7a7a9a; font-size: 0.8rem;">
                            P.S. Young Pierre forever. 🎭<br>
                            P.P.S. I hope you know how much you mean to me.
                        </div>
                    </div>
                `;
            }

            const unlockBtn = document.getElementById('unlockBtn');
            const messageBox = document.getElementById('messageBox');
            const photoSection = document.getElementById('photoSection');
            const progressText = document.getElementById('progressText');

            const inputs = QUESTIONS.map(q => document.getElementById(q.inputId));
            let correctStatus = [false, false, false];

            function checkAllAnswers() {
                let correctCount = 0;
                QUESTIONS.forEach((q, index) => {
                    const input = document.getElementById(q.inputId);
                    const value = input.value.trim().toLowerCase();
                    const item = document.getElementById(q.id);
                    
                    const isCorrect = q.correctAnswers.some(ans => value === ans.toLowerCase());
                    
                    if (value && isCorrect) {
                        item.classList.add('correct');
                        item.classList.remove('wrong');
                        correctStatus[index] = true;
                        correctCount++;
                    } else if (value && !isCorrect) {
                        item.classList.add('wrong');
                        item.classList.remove('correct');
                        correctStatus[index] = false;
                    } else {
                        item.classList.remove('correct', 'wrong');
                        correctStatus[index] = false;
                    }
                });

                progressText.textContent = `${correctCount} of ${QUESTIONS.length} answered correctly`;
                return correctCount === QUESTIONS.length;
            }

            inputs.forEach(input => {
                input.addEventListener('input', function() {
                    const allCorrect = checkAllAnswers();
                    if (allCorrect) {
                        unlockBtn.style.opacity = '1';
                        unlockBtn.textContent = '🎁 OPEN GIFT!';
                    } else {
                        unlockBtn.textContent = '🔓 UNLOCK GIFT';
                    }
                    if (!unlockBtn.disabled) {
                        const msg = messageBox.innerText;
                        if (msg.includes('Wrong') || msg.includes('fill') || msg.includes('correctly')) {
                            messageBox.innerHTML = `<span style="color:#6a6a8a; font-size:0.95rem;">🔒 Answer all questions to unlock</span>`;
                            messageBox.style.borderColor = '#2a2a4a';
                        }
                    }
                });
            });

            inputs.forEach(input => {
                input.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        unlockBtn.click();
                    }
                });
            });

            function createSparkles() {
                const emojis = ['✨', '🎉', '🎊', '💖', '🌟', '🎂', '🥳', '💫', '🌸', '💝', '🎈', '🎁'];
                for (let i = 0; i < 25; i++) {
                    const el = document.createElement('div');
                    el.className = 'sparkle';
                    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                    el.style.left = (5 + Math.random() * 90) + '%';
                    el.style.top = (10 + Math.random() * 70) + '%';
                    el.style.fontSize = (1 + Math.random() * 2.5) + 'rem';
                    el.style.animationDuration = (0.6 + Math.random() * 1) + 's';
                    document.body.appendChild(el);
                    setTimeout(() => el.remove(), 2000);
                }
            }

            function unlockGift() {
                const allCorrect = checkAllAnswers();

                if (!allCorrect) {
                    showMessage(`
                        <span class="error-text">❌ Not all answers are correct yet!<br>
                        <span style="font-size:0.85rem; color:#7a7a9a;">Think about your nickname and birthday! 💭</span></span>
                    `, true);
                    return;
                }

                const age = new Date().getFullYear() - 2005;
                const longMessage = getBirthdayMessage(age);
                
                showMessage(longMessage, false);
                unlockBtn.disabled = true;
                unlockBtn.textContent = '🎁 UNLOCKED! 💕';
                document.querySelector('.card').style.boxShadow = '0 0 60px #f9d34255';

                photoSection.classList.add('unlocked');

                createSparkles();
                setTimeout(createSparkles, 400);
                setTimeout(createSparkles, 1000);
                setTimeout(createSparkles, 1800);
                setTimeout(createSparkles, 2800);

                setTimeout(() => {
                    const audio = document.querySelector('audio');
                    if (audio) {
                        audio.play().catch(() => {});
                    }
                }, 500);
            }

            function showMessage(html, isError = false) {
                messageBox.innerHTML = html;
                messageBox.style.borderColor = isError ? '#6a2a2a' : '#2a6a3a';
                messageBox.style.maxHeight = '500px';
            }

            unlockBtn.addEventListener('click', unlockGift);
            checkAllAnswers();

            console.log('🎂 Happy Birthday Caroline! 🎂');
        })();
    </script>
</body>
</html>
